AWSTemplateFormatVersion: 2010-09-09
Description: CreditOdds Social Media Posting Service

Transform:
- AWS::Serverless-2016-10-31

Parameters:
  ENDPOINT:
    Type: String
    Description: MySQL database endpoint
    NoEcho: true
  DATABASE:
    Type: String
    Description: MySQL database name
    NoEcho: true
  USERNAME:
    Type: String
    Description: MySQL database username
    NoEcho: true
  PASSWORD:
    Type: String
    Description: MySQL database password
    NoEcho: true
  ANTHROPICAPIKEY:
    Type: String
    Description: Anthropic API key for Claude Haiku
    NoEcho: true
  SOCIALAPIKEY:
    Type: String
    Description: API key for CI/CD queue endpoint
    NoEcho: true
  TWITTERAPIKEY:
    Type: String
    Description: Twitter API key
    NoEcho: true
  TWITTERAPISECRET:
    Type: String
    Description: Twitter API secret
    NoEcho: true
  TWITTERACCESSTOKEN:
    Type: String
    Description: Twitter access token
    NoEcho: true
  TWITTERACCESSTOKENSECRET:
    Type: String
    Description: Twitter access token secret
    NoEcho: true
  TWITTERCARDWIREAPIKEY:
    Type: String
    Description: API key for the @card_wire Developer App (leave blank to reuse the shared app)
    Default: ""
    NoEcho: true
  TWITTERCARDWIREAPISECRET:
    Type: String
    Description: API secret for the @card_wire Developer App (leave blank to reuse the shared app)
    Default: ""
    NoEcho: true
  TWITTERCARDWIREACCESSTOKEN:
    Type: String
    Description: User access token for the @card_wire X account
    NoEcho: true
  TWITTERCARDWIREACCESSTOKENSECRET:
    Type: String
    Description: User access token secret for the @card_wire X account
    NoEcho: true
  FACEBOOKPAGEID:
    Type: String
    Description: Facebook Page ID
    Default: ''
  FACEBOOKPAGEACCESSTOKEN:
    Type: String
    Description: Facebook Page Access Token (long-lived)
    NoEcho: true
    Default: ''
  VpcPrivateSubnetIds:
    Type: CommaDelimitedList
    Description: NAT-routed private subnets the functions attach to. Defaults are the shared us-east-1 VPC (vpc-0cc30471) next to the database; the retired us-east-2 stack used the creditodds-network subnets.
    Default: subnet-38dcb136,subnet-7a936d4b
  VpcLambdaSecurityGroupId:
    Type: String
    Description: Security group for the functions. Default is the shared VPC's self-referencing default SG, which is what grants database access.
    Default: sg-d83c41e6
  # The images bucket name and its CloudFront distribution are globally
  # unique, so only ONE stack (originally the us-east-2 one) can own them.
  # A stack in another region deploys with CreateStorage=false and points at
  # the existing bucket/CDN instead of creating its own.
  CreateStorage:
    Type: String
    Description: Whether this stack creates the social-images S3 bucket + CloudFront CDN, or references existing ones.
    Default: "true"
    AllowedValues: ["true", "false"]
  ExistingSocialImagesBucket:
    Type: String
    Description: Bucket name to use when CreateStorage=false.
    Default: creditodds-social-images
  ExistingCdnDomain:
    Type: String
    Description: CloudFront domain to use when CreateStorage=false.
    Default: d2rswc0dd0ndyt.cloudfront.net
  SchedulerEnabled:
    Type: String
    Description: Whether the 35-minute publisher schedule fires in this region. Keep "false" until this region owns publishing (see comment on ScheduleRule).
    Default: "true"
    AllowedValues: ["true", "false"]

# Every function runs inside a VPC. In us-east-1 (current) that is the shared
# VPC next to the Aurora cluster, so DB traffic stays private in-VPC and
# internet egress uses the VPC's existing NAT. SAM adds
# AWSLambdaVPCAccessExecutionRole automatically when VpcConfig is set.
Globals:
  Function:
    VpcConfig:
      SecurityGroupIds:
        - !Ref VpcLambdaSecurityGroupId
      SubnetIds: !Ref VpcPrivateSubnetIds

Conditions:
  ShouldCreateStorage: !Equals [!Ref CreateStorage, "true"]
  SchedulerOn: !Equals [!Ref SchedulerEnabled, "true"]

Resources:
  # S3 Bucket for social media images
  SocialImagesBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateStorage
    Properties:
      BucketName: creditodds-social-images
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [PUT]
            AllowedOrigins: ['https://social.creditodds.com', 'http://localhost:3000']
            MaxAge: 300

  # Origin Access Control for CloudFront → S3
  SocialImagesOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: ShouldCreateStorage
    Properties:
      OriginAccessControlConfig:
        Name: social-images-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # S3 bucket policy granting CloudFront read access
  SocialImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: ShouldCreateStorage
    Properties:
      Bucket: !Ref SocialImagesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SocialImagesBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${SocialImagesCDN}'

  # CloudFront for image CDN
  SocialImagesCDN:
    Type: AWS::CloudFront::Distribution
    Condition: ShouldCreateStorage
    Properties:
      DistributionConfig:
        Origins:
          - DomainName: !GetAtt SocialImagesBucket.RegionalDomainName
            Id: S3Origin
            OriginAccessControlId: !GetAtt SocialImagesOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        Enabled: true
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          ForwardedValues:
            QueryString: false
        PriceClass: PriceClass_100

  # Firebase Token Authorizer
  FirebaseAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/firebase-authorizer.firebaseAuthorizerHandler
      Runtime: nodejs22.x
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          FIREBASE_PROJECT_ID: creditodds

  # API Gateway
  SocialPostingAPI:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Auth:
        DefaultAuthorizer: FirebaseAuthorizer
        Authorizers:
          FirebaseAuthorizer:
            FunctionArn: !GetAtt FirebaseAuthorizerFunction.Arn
            FunctionPayloadType: TOKEN
            Identity:
              Header: Authorization
              ReauthorizeEvery: 300

  # --- Lambda Functions ---

  SocialPostsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/social-posts.handler
      Runtime: nodejs22.x
      MemorySize: 128
      Timeout: 30
      Description: CRUD operations for social media posts
      Environment:
        Variables:
          ENDPOINT: !Ref ENDPOINT
          DATABASE: !Ref DATABASE
          USERNAME: !Ref USERNAME
          PASSWORD: !Ref PASSWORD
      Events:
        GetPosts:
          Type: Api
          Properties:
            Path: /social/posts
            Method: GET
            RestApiId: !Ref SocialPostingAPI
        CreatePost:
          Type: Api
          Properties:
            Path: /social/posts
            Method: POST
            RestApiId: !Ref SocialPostingAPI
        UpdatePost:
          Type: Api
          Properties:
            Path: /social/posts
            Method: PUT
            RestApiId: !Ref SocialPostingAPI
        DeletePost:
          Type: Api
          Properties:
            Path: /social/posts
            Method: DELETE
            RestApiId: !Ref SocialPostingAPI
        PostsOptions:
          Type: Api
          Properties:
            Path: /social/posts
            Method: OPTIONS
            RestApiId: !Ref SocialPostingAPI
            Auth:
              Authorizer: NONE

  SocialSchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/social-scheduler.handler
      Runtime: nodejs22.x
      MemorySize: 256
      Timeout: 120
      Description: Scheduled post publisher - triggered every 35 minutes
      Environment:
        Variables:
          ENDPOINT: !Ref ENDPOINT
          DATABASE: !Ref DATABASE
          USERNAME: !Ref USERNAME
          PASSWORD: !Ref PASSWORD
          TWITTER_API_KEY: !Ref TWITTERAPIKEY
          TWITTER_API_SECRET: !Ref TWITTERAPISECRET
          TWITTER_ACCESS_TOKEN: !Ref TWITTERACCESSTOKEN
          TWITTER_ACCESS_TOKEN_SECRET: !Ref TWITTERACCESSTOKENSECRET
          TWITTER_CARDWIRE_API_KEY: !Ref TWITTERCARDWIREAPIKEY
          TWITTER_CARDWIRE_API_SECRET: !Ref TWITTERCARDWIREAPISECRET
          TWITTER_CARDWIRE_ACCESS_TOKEN: !Ref TWITTERCARDWIREACCESSTOKEN
          TWITTER_CARDWIRE_ACCESS_TOKEN_SECRET: !Ref TWITTERCARDWIREACCESSTOKENSECRET
          FACEBOOK_PAGE_ID: !Ref FACEBOOKPAGEID
          FACEBOOK_PAGE_ACCESS_TOKEN: !Ref FACEBOOKPAGEACCESSTOKEN
      Events:
        ScheduleRule:
          Type: Schedule
          Properties:
            Schedule: rate(35 minutes)
            Description: Post next queued social media post every 35 minutes
            # Exactly one region's scheduler may be enabled at a time — two
            # would race on the same DB queue and double-post to X/Facebook.
            Enabled: !If [SchedulerOn, true, false]

  SocialPublishFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/social-publish.handler
      Runtime: nodejs22.x
      MemorySize: 256
      Timeout: 120
      Description: Immediately publish a queued post (admin-only)
      Environment:
        Variables:
          ENDPOINT: !Ref ENDPOINT
          DATABASE: !Ref DATABASE
          USERNAME: !Ref USERNAME
          PASSWORD: !Ref PASSWORD
          TWITTER_API_KEY: !Ref TWITTERAPIKEY
          TWITTER_API_SECRET: !Ref TWITTERAPISECRET
          TWITTER_ACCESS_TOKEN: !Ref TWITTERACCESSTOKEN
          TWITTER_ACCESS_TOKEN_SECRET: !Ref TWITTERACCESSTOKENSECRET
          TWITTER_CARDWIRE_API_KEY: !Ref TWITTERCARDWIREAPIKEY
          TWITTER_CARDWIRE_API_SECRET: !Ref TWITTERCARDWIREAPISECRET
          TWITTER_CARDWIRE_ACCESS_TOKEN: !Ref TWITTERCARDWIREACCESSTOKEN
          TWITTER_CARDWIRE_ACCESS_TOKEN_SECRET: !Ref TWITTERCARDWIREACCESSTOKENSECRET
          FACEBOOK_PAGE_ID: !Ref FACEBOOKPAGEID
          FACEBOOK_PAGE_ACCESS_TOKEN: !Ref FACEBOOKPAGEACCESSTOKEN
      Events:
        Publish:
          Type: Api
          Properties:
            Path: /social/publish
            Method: POST
            RestApiId: !Ref SocialPostingAPI
        PublishOptions:
          Type: Api
          Properties:
            Path: /social/publish
            Method: OPTIONS
            RestApiId: !Ref SocialPostingAPI
            Auth:
              Authorizer: NONE

  SocialAccountsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/social-accounts.handler
      Runtime: nodejs22.x
      MemorySize: 128
      Timeout: 30
      Description: Platform account management
      Environment:
        Variables:
          ENDPOINT: !Ref ENDPOINT
          DATABASE: !Ref DATABASE
          USERNAME: !Ref USERNAME
          PASSWORD: !Ref PASSWORD
      Events:
        GetAccounts:
          Type: Api
          Properties:
            Path: /social/accounts
            Method: GET
            RestApiId: !Ref SocialPostingAPI
        UpdateAccount:
          Type: Api
          Properties:
            Path: /social/accounts
            Method: PUT
            RestApiId: !Ref SocialPostingAPI

  SocialSettingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/social-settings.handler
      Runtime: nodejs22.x
      MemorySize: 128
      Timeout: 30
      Description: Global social posting settings
      Environment:
        Variables:
          ENDPOINT: !Ref ENDPOINT
          DATABASE: !Ref DATABASE
          USERNAME: !Ref USERNAME
          PASSWORD: !Ref PASSWORD
      Events:
        GetSettings:
          Type: Api
          Properties:
            Path: /social/settings
            Method: GET
            RestApiId: !Ref SocialPostingAPI
        UpdateSettings:
          Type: Api
          Properties:
            Path: /social/settings
            Method: PUT
            RestApiId: !Ref SocialPostingAPI
        SettingsOptions:
          Type: Api
          Properties:
            Path: /social/settings
            Method: OPTIONS
            RestApiId: !Ref SocialPostingAPI
            Auth:
              Authorizer: NONE
        AccountsOptions:
          Type: Api
          Properties:
            Path: /social/accounts
            Method: OPTIONS
            RestApiId: !Ref SocialPostingAPI
            Auth:
              Authorizer: NONE

  SocialGenerateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/social-generate.handler
      Runtime: nodejs22.x
      MemorySize: 128
      Timeout: 30
      Description: Generate social media post text using Claude Haiku
      Environment:
        Variables:
          ANTHROPIC_API_KEY: !Ref ANTHROPICAPIKEY
      Events:
        Generate:
          Type: Api
          Properties:
            Path: /social/generate
            Method: POST
            RestApiId: !Ref SocialPostingAPI
        GenerateOptions:
          Type: Api
          Properties:
            Path: /social/generate
            Method: OPTIONS
            RestApiId: !Ref SocialPostingAPI
            Auth:
              Authorizer: NONE

  SocialUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/social-upload.handler
      Runtime: nodejs22.x
      MemorySize: 128
      Timeout: 10
      Description: Generate presigned S3 URLs for image upload
      Environment:
        Variables:
          S3_BUCKET: !If [ShouldCreateStorage, !Ref SocialImagesBucket, !Ref ExistingSocialImagesBucket]
          CDN_DOMAIN: !If [ShouldCreateStorage, !GetAtt SocialImagesCDN.DomainName, !Ref ExistingCdnDomain]
      Policies:
        - S3CrudPolicy:
            BucketName: !If [ShouldCreateStorage, !Ref SocialImagesBucket, !Ref ExistingSocialImagesBucket]
      Events:
        Upload:
          Type: Api
          Properties:
            Path: /social/upload
            Method: POST
            RestApiId: !Ref SocialPostingAPI
        UploadOptions:
          Type: Api
          Properties:
            Path: /social/upload
            Method: OPTIONS
            RestApiId: !Ref SocialPostingAPI
            Auth:
              Authorizer: NONE

  SocialQueueFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/social-queue.handler
      Runtime: nodejs22.x
      MemorySize: 128
      Timeout: 30
      Description: Queue posts from CI/CD (API-key auth, no Firebase)
      Environment:
        Variables:
          ENDPOINT: !Ref ENDPOINT
          DATABASE: !Ref DATABASE
          USERNAME: !Ref USERNAME
          PASSWORD: !Ref PASSWORD
          SOCIAL_API_KEY: !Ref SOCIALAPIKEY
          S3_BUCKET: !If [ShouldCreateStorage, !Ref SocialImagesBucket, !Ref ExistingSocialImagesBucket]
          CDN_DOMAIN: !If [ShouldCreateStorage, !GetAtt SocialImagesCDN.DomainName, !Ref ExistingCdnDomain]
          # Lets the queue handler kick the scheduler the instant a card-wire
          # post lands, so it publishes immediately instead of on the next tick.
          SCHEDULER_FUNCTION_NAME: !Ref SocialSchedulerFunction
      Policies:
        - S3CrudPolicy:
            BucketName: !If [ShouldCreateStorage, !Ref SocialImagesBucket, !Ref ExistingSocialImagesBucket]
        - LambdaInvokePolicy:
            FunctionName: !Ref SocialSchedulerFunction
      Events:
        QueuePost:
          Type: Api
          Properties:
            Path: /social/queue
            Method: POST
            RestApiId: !Ref SocialPostingAPI
            Auth:
              Authorizer: NONE
        QueueOptions:
          Type: Api
          Properties:
            Path: /social/queue
            Method: OPTIONS
            RestApiId: !Ref SocialPostingAPI
            Auth:
              Authorizer: NONE

  SocialSchedulerErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SocialSchedulerFunction}"
      FilterPattern: '"Scheduler error:"'
      MetricTransformations:
        - MetricNamespace: CreditOdds/SocialPosting
          MetricName: SocialSchedulerErrors
          MetricValue: "1"

  SocialSchedulerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-SocialSchedulerErrors"
      AlarmDescription: Alarm when the social scheduler logs repeated errors.
      Namespace: CreditOdds/SocialPosting
      MetricName: SocialSchedulerErrors
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  SocialPostingAPIUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${SocialPostingAPI}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  SocialImagesBucketName:
    Description: S3 bucket for social images
    Value: !If [ShouldCreateStorage, !Ref SocialImagesBucket, !Ref ExistingSocialImagesBucket]
  SocialImagesCDNDomain:
    Description: CloudFront domain for social images
    Value: !If [ShouldCreateStorage, !GetAtt SocialImagesCDN.DomainName, !Ref ExistingCdnDomain]
